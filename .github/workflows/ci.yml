name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall -q app
      - name: guardrails and verification, tested from the outside
        run: python -m pytest -q
      - name: app boots and serves the UI and the state endpoint
        run: |
          uvicorn app.main:app --port 8765 & PID=$!
          for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:8765/ && break; sleep 1; done
          curl -sf -o /dev/null -w 'root %{http_code}\n' http://127.0.0.1:8765/
          curl -sf -o /dev/null -w 'state %{http_code}\n' http://127.0.0.1:8765/api/state
          kill $PID
